[project]
name = "opspilot-ai-runtime"
version = "0.1.0"
description = "OpsPilot AI Runtime: typed single-step Intent/Proposal service"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["uv_build==0.9.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opspilot_ai"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
