# OpsPilot Demo 靶场（09 §4～§9）。本文件目前含 S3（统计消费者停止，08 TASK-093）、S1（Redis 延迟，TASK-094）与 S2（MySQL 慢查询，TASK-095）
# 所需的运行单元：
#   同一个 ShortLink project 产物跑成 project-api（创建/跳转/写统计 Stream）与 statistics-consumer（只消费统计）两个容器；
#   二者的 Redis 流量都经 Toxiproxy（redis-proxy）到达 Redis，OpsPilot 的 cache.inspect 走同一代理（09 §29）。
# Prometheus、Loki、负载发生器与 OpsPilot 自身由 TASK-105 加入；ShortLink 原有的 compose.dev.yaml 不受影响。
#
# 前置：SHORTLINK_REPO 指向 ShortLink 仓库（含 project/Dockerfile 与 application-demo.yaml），并已在该仓库打好 project 产物：
#   docker compose -f compose.dev.yaml --profile tools run --rm build \
#     mvn -B -ntp -Dspotless.apply.skip=true -Dspotless.check.skip=true -DskipTests -pl project -am package
# 启动：SHORTLINK_REPO=/path/to/shortlink docker compose -f deploy/demo/docker-compose.yml up -d --build --wait
#
# 端口只绑定 127.0.0.1，供本机运行的 OpsPilot 与验证脚本使用；账号与 ShortLink 开发环境相同，只用于本机 Demo。
name: opspilot-demo

x-shortlink-project: &shortlink-project
  # 只由 project-api 构建；statistics-consumer 直接使用同一个镜像（同一产物，09 §5）
  image: opspilot-demo/shortlink-project:local
  environment: &shortlink-env
    # 经 Toxiproxy 访问 Redis（S1 在代理上注入延迟）
    SHORTLINK_REDIS_HOST: redis-proxy
    SHORTLINK_REDIS_PORT: "6379"
    # 短链完整地址的域名；访问时的 Host 必须与它一致（ShortLink README）
    SHORTLINK_DOMAIN: ${SHORTLINK_DOMAIN:-localhost:18001}
    TZ: Asia/Shanghai
  depends_on:
    mysql-demo-objects:
      condition: service_completed_successfully
    redis-proxy:
      condition: service_healthy
  healthcheck:
    # Demo Profile 的 Actuator 在独立管理端口 8081
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 30s

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: shortlink_local_root
      MYSQL_DATABASE: link
      MYSQL_USER: shortlink
      MYSQL_PASSWORD: shortlink_local_only
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13317:3306"
    networks: [target, edge]
    volumes:
      - shortlink-mysql-data:/var/lib/mysql
      - ${SHORTLINK_REPO:?SHORTLINK_REPO must point to the ShortLink repository}/resources/database/link.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER -D link -e 'SELECT 1 FROM t_link_0 LIMIT 0' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  mysql-demo-objects:
    # 一次性初始化：幂等创建 Demo 专用存储过程与控制账号（deploy/demo/mysql/demo-objects.sql），已有数据卷同样生效
    image: mysql:8.4.11
    command: ["sh", "-c", "MYSQL_PWD=shortlink_local_root mysql --protocol=TCP -h mysql -uroot < /demo/demo-objects.sql"]
    volumes:
      - ./mysql/demo-objects.sql:/demo/demo-objects.sql:ro
    networks: [target]
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    # Consumer Group 的 lag 需要 Redis 7.0+，XINFO CONSUMERS 的 inactive 需要 7.2+（09 §10）
    image: redis:7.4.5
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16380:6379"
    networks: [target, edge]
    volumes:
      - shortlink-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-proxy:
    # Demo / Fault Infrastructure 专用（09 §8～§9）：启动时按配置建立 shortlink-redis 代理（0.0.0.0:6379 → redis:6379）
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      # 经代理的 Redis：本机 OpsPilot 的 Fault Lab PING 与调查 Provider 使用，与 ShortLink 同一路径
      - "127.0.0.1:16381:6379"
      # 控制 API 只给本机 Fault Lab 使用，不进入被调查资源的数据源
      - "127.0.0.1:18474:8474"
    networks: [target, edge]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 镜像没有 shell；能查到代理即说明 API 可用且启动配置已加载
      test: ["CMD", "/toxiproxy-cli", "inspect", "shortlink-redis"]
      interval: 3s
      timeout: 3s
      retries: 20

  project-api:
    <<: *shortlink-project
    build:
      context: ${SHORTLINK_REPO:?SHORTLINK_REPO must point to the ShortLink repository}
      dockerfile: project/Dockerfile
    container_name: shortlink-project-api
    environment:
      <<: *shortlink-env
      SHORTLINK_STATS_CONSUMER_ENABLED: "false"
      # S2：Demo 统计快照刷新负载只在 project-api 开启，经其自身连接池执行（09 §45～§46）
      SHORTLINK_SNAPSHOT_WORKLOAD_ENABLED: "true"
    ports:
      - "127.0.0.1:18001:8001"
      # 管理端口（健康、指标、Demo 负载控制）只给本机 Fault Lab 使用
      - "127.0.0.1:18081:8081"
    networks: [target, edge]

  statistics-consumer:
    <<: *shortlink-project
    # 名称与 OpsPilot Demo Seed 的 docker.resource.binding 一致；S3 注入与 service.restart 都按它解析容器
    container_name: shortlink-statistics-consumer
    pull_policy: never
    environment:
      <<: *shortlink-env
      SHORTLINK_STATS_CONSUMER_ENABLED: "true"
    # 停止后只能由 Fault Lab Reset 或经审批的 service.restart 启动，不自动拉起
    restart: "no"
    # 只在内部网络：没有外网出口，地域解析立即失败并记为未知（ShortLink README），不因外呼超时拖慢消费
    networks: [target]

networks:
  # 靶场内部网络，不提供外网出口
  target:
    internal: true
  # 只用于把端口发布到 127.0.0.1
  edge: {}

volumes:
  shortlink-mysql-data:
  shortlink-redis-data:
